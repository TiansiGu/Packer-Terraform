    - name: Reboot the server (if required).
      ansible.builtin.reboot:
      when: reboot_required_file.stat.exists == true

    - name: Remove dependencies that are no longer required.
      ansible.builtin.yum:
        autoremove: yes

  handlers: # Verify we are running the latest docker
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
        enabled: yes
      notify:
        - Show Docker Version  # Notify a cmd task to show the Docker's version

    - name: Show Docker Version
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version_output
      notify:
        - Print Docker Restarted Message with Version

    - name: Print Docker Restarted Message with Version
      ansible.builtin.debug:
        msg: "Docker service was restarted because the packages were updated. Docker version: {{ docker_version_output.stdout }}"


- name: Report disk usage for each webserver node
  hosts: Group_webserver_node
  gather_facts: no
  tasks:
    - name: Display disk space
      shell: df -h
      register: disk_space

    - name: Debug output
      debug:
        var: disk_space.stdout_lines

- name: Report disk usage for bastion host
  hosts: Group_bastion
  gather_facts: no
  tasks:
    - name: Display disk space
      shell: df -h
      register: disk_space

    - name: Debug output
      debug:
        var: disk_space.stdout_lines