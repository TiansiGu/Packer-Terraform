    - name: Extract the installed Docker version number
      ansible.builtin.set_fact:
        installed_version: "{{ installed_docker_version.stdout.split(',')[0].split(' ')[2] }}"

    - name: Fetch the latest stable Docker version
      ansible.builtin.uri:
        url: "https://api.github.com/repos/docker/docker-ce/releases/latest"
        method: GET
        return_content: yes
      register: latest_docker_release

    - name: Extract the latest Docker version from the API response
      ansible.builtin.set_fact:
        latest_version: "{{ latest_docker_release.json.tag_name }}"

    - name: Compare the installed version with the latest version
      ansible.builtin.debug:
        msg: "Installed Docker version: {{ installed_version }}. Latest Docker version: {{ latest_version }}."

    - name: Ensure Docker is the latest version (if needed)
