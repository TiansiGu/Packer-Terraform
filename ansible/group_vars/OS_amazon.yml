ansible_user: ec2-user
ansible_ssh_private_key_file: ../ami-key-pair.pem
ansible_ssh_common_args: >-
  -o ProxyCommand="ssh
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null
  -i ../ami-key-pair.pem
  -p 22
  -W %h:%p
  -q ec2-user@{{ hostvars[groups["Group_bastion"][0]]["public_ip_address"] }}"